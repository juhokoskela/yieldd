name: Runner test

on:
  workflow_dispatch:
    inputs:
      outcome:
        description: Test success, intentional failure, or cancellation while sleeping.
        type: choice
        default: success
        options: [success, failure, cancellation]
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

jobs:
  docker:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'yieldd-runner-test'
    runs-on: yieldd
    timeout-minutes: 10
    steps:
      - name: Check Docker daemon
        run: docker info
      - name: Run a Docker container
        run: docker run --rm hello-world
      - name: Exercise the requested result
        shell: bash
        env:
          EXPECTED_OUTCOME: ${{ inputs.outcome || 'success' }}
        run: |
          set -euo pipefail
          case "$EXPECTED_OUTCOME" in
            success) echo 'Runner test passed.' ;;
            failure) echo 'Intentional test failure.' >&2; exit 7 ;;
            cancellation) echo 'Cancel this application workflow run now.'; sleep 240; echo 'Cancellation window expired without cancellation.' >&2; exit 1 ;;
            *) echo 'Unknown test outcome.' >&2; exit 2 ;;
          esac
