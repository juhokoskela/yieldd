name: macOS runner test

on:
  pull_request:

permissions: {}

jobs:
  macos:
    runs-on: yieldd-macos
    timeout-minutes: 10
    steps:
      - name: Check macOS and Xcode
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version

      - name: Boot an iOS Simulator
        run: |
          test "$(stat -f %Su /dev/console)" = "$(id -un)"
          launchctl print "gui/$(id -u)" >/dev/null

          runtime="$(
            xcrun simctl list runtimes \
              | sed -n 's/.* - \(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[^ ]*\)$/\1/p' \
              | head -n 1
          )"
          device_type="$(
            xcrun simctl list devicetypes \
              | sed -n 's/.*\(com\.apple\.CoreSimulator\.SimDeviceType\.iPhone[^)]*\).*/\1/p' \
              | head -n 1
          )"
          test -n "$runtime"
          test -n "$device_type"

          device_id="$(xcrun simctl create yieldd-ci "$device_type" "$runtime")"
          trap 'xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true; xcrun simctl delete "$device_id"' EXIT

          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl spawn "$device_id" /usr/bin/uname -a
