name: Network prototype

on:
  pull_request:
    paths:
      - 'Prototypes/RunnerNetwork/**'
      - 'Sources/Yieldd/RunnerNetworkRelay.swift'
      - 'Sources/Yieldd/PacketSocket.swift'
      - 'Scripts/build-network-relay.sh'
      - 'Scripts/prepare-patched-source.sh'
      - 'Scripts/test-prepare-patched-source.sh'
      - 'Packaging/yieldd.entitlements'
      - '.github/workflows/network-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'Prototypes/RunnerNetwork/**'
      - 'Sources/Yieldd/RunnerNetworkRelay.swift'
      - 'Sources/Yieldd/PacketSocket.swift'
      - 'Scripts/build-network-relay.sh'
      - 'Scripts/prepare-patched-source.sh'
      - 'Scripts/test-prepare-patched-source.sh'
      - 'Packaging/yieldd.entitlements'
      - '.github/workflows/network-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Relay and Container fork checks
    runs-on: yieldd-macos
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Prototypes/RunnerNetwork/go.mod
          cache-dependency-path: Prototypes/RunnerNetwork/go.sum
      - name: Build and check without a VM or installed Container service
        run: bash Prototypes/RunnerNetwork/check.sh
