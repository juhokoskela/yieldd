name: Runner bootstrap prototype
run-name: Bootstrap ${{ inputs.runner-name }}

on:
  workflow_dispatch:
    inputs:
      fallback-runner:
        description: Disposable fallback runner as a JSON string or label array. Must not target yieldd.
        type: string
        required: true
      runner-name:
        description: Unique yieldd-bootstrap- name matching the single-use JIT secret.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: yieldd-bootstrap-prototype
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ${{ fromJSON(inputs['fallback-runner']) }}
    steps:
      - name: Reject reruns of single-use credentials
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - name: Check out trusted bootstrap code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run one nested listener
        uses: ./.github/actions/bootstrap-runner
        with:
          jit-config: ${{ secrets.YIELDD_BOOTSTRAP_JIT }}
          runner-name: ${{ inputs.runner-name }}
      - name: Verify the outer job context survived
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -z "${YIELDD_NESTED_ENV:-}"
          test "$GITHUB_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$GITHUB_WORKFLOW" = 'Runner bootstrap prototype'
