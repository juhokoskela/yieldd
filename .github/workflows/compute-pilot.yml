name: Single-use ARM64 compute pilot
on:
  push:
    branches: [bench/m9g-three-arm-e65f8b1a9e]
permissions:
  contents: read
jobs:
  glasseq:
    name: GlassEQServer / ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: archive, runner: yd-e65f8b1a9e-r4-archive, seed: B}
          - {host: seeded, runner: yd-e65f8b1a9e-r4-seeded, seed: B}
          - {host: cold, runner: yd-e65f8b1a9e-r4-cold, seed: B}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GLASSEQ_TEST_DATABASE_URL: postgres://glasseq:glasseq@127.0.0.1:5432/glasseq?sslmode=disable
    steps:
      - name: Record host
        run: |
          /usr/local/bin/yd-io
          set -eu
          df -h /mnt/yd
          test "$(uname -m)" = aarch64
          echo "Runner $RUNNER_NAME"; nproc; grep MemTotal /proc/meminfo
          lscpu | grep -E 'Model name|Architecture|CPU.s.:'
          docker version --format '{{.Server.Version}}'
          echo "GOCACHE=/mnt/yd/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=/mnt/yd/go-modules" >> "$GITHUB_ENV"
          grep -q '/pilot.slice/' /proc/self/cgroup
          test "$(cat /sys/fs/cgroup/pilot.slice/memory.max)" = 12884901888
          test "$(nproc)" = 4
          echo VERIFIED_RUNNER_4CPU_12G
      - name: Check out pinned GlassEQServer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: juhokoskela/GlassEQServer
          ref: 87cd5a17938c2b9b6036a4d37b0b583406989261
          persist-credentials: false
      - name: Restore exact archive
        if: matrix.host == 'archive'
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            /mnt/yd/go-build
            /mnt/yd/go-modules
            /opt/hostedtoolcache/go
          key: yd-ebs-e65f8b1a9e-${{ matrix.seed }}
          fail-on-cache-miss: true
      - name: Verify cache inputs
        env:
          ARM: ${{ matrix.host }}
          EXACT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          /usr/local/bin/yd-io
          if test "$ARM" = cold; then
            test ! -e /mnt/yd/go-build/seed-marker
            test ! -e /opt/hostedtoolcache/go/1.27.4/arm64.complete
          else
            test "$(cat /mnt/yd/go-build/seed-marker)" = "${{ matrix.seed }}"
            test -f /opt/hostedtoolcache/go/1.27.4/arm64.complete
          fi
          if test "$ARM" = archive; then test "$EXACT" = true; fi
          echo VERIFIED_CACHE_INPUTS_"$ARM"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          cache: false
      - name: Start PostgreSQL and apply migrations
        run: |
          /usr/local/bin/yd-io
          set -euo pipefail
          test -z "$(docker ps -aq)"
          test -z "$(docker volume ls -q)"
          docker run -d --name pilot-postgres -p 127.0.0.1:5432:5432 -e POSTGRES_DB=glasseq -e POSTGRES_USER=glasseq -e POSTGRES_PASSWORD=glasseq postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          grep -q '/pilot.slice/' "/proc/$(docker inspect -f '{{.State.Pid}}' pilot-postgres)/cgroup"
          echo VERIFIED_CONTAINER_SLICE
          for i in $(seq 60); do docker exec pilot-postgres pg_isready -h 127.0.0.1 -U glasseq && break; sleep 1; done
          chmod -R a+rX migrations
          docker run --rm --network host -v "$PWD/migrations:/migrations:ro" -e GOOSE_DRIVER=postgres -e GOOSE_DBSTRING="$GLASSEQ_TEST_DATABASE_URL" juhokoskela/goose:v3.27.3@sha256:db4be381f2173bfd8994b9ca03e2fa2f8d7692ac3cef4aa5e2059db3e760cc3d up
      - name: Change the command usage in this checkout
        run: |
          /usr/local/bin/yd-io
          set -eu
          sed -i 's/usage: glasseqserver \[check-stripe-catalog\]/usage: glasseqserver [check-stripe-catalog] (cache probe)/' cmd/glasseqserver/main.go
          grep -Fq '(cache probe)' cmd/glasseqserver/main.go
      - name: Test with race detection
        run: |
          /usr/local/bin/yd-io
          set -eu
          go test -x -json -race -p 1 -count=1 ./... > "$RUNNER_TEMP/tests.jsonl" 2>"$RUNNER_TEMP/race-trace" || { jq -c 'select(.Action=="fail" or .Action=="build-fail") | {Package, Test, Action}' "$RUNNER_TEMP/tests.jsonl"
            jq -rs 'map(select(.Action=="fail" and .Test) | [.Package,.Test]) as $failed | .[] | select(.Action=="output" and ([.Package,.Test] as $p | $failed | index($p))) | .Output' "$RUNNER_TEMP/tests.jsonl" | tail -100
            tail -20 "$RUNNER_TEMP/race-trace"; exit 1; }
          jq -r 'select(.Action == "build-output") | .Output' "$RUNNER_TEMP/tests.jsonl" >> "$RUNNER_TEMP/race-trace"
          echo "RACE_COMPILER_INVOCATIONS=$(grep -cE '/pkg/tool/linux_arm64/compile ' "$RUNNER_TEMP/race-trace" || true)"
          awk '/(compile|tool[.]compile)[[:space:]].*-o / {print "GO_COMPILE_EXAMPLE " substr($0,1,180); if (++n==2) exit}' "$RUNNER_TEMP/race-trace"
          grep -E '^(WORK=|[^#].*(pkg/tool|/compile | tool .*compile))' "$RUNNER_TEMP/race-trace" | cut -c1-145 | head -5 || true
          echo "RACE_TEST_STARTS=$(jq -s '[.[] | select(.Action=="run" and .Test)] | length' "$RUNNER_TEMP/tests.jsonl")"
          jq -s '{passed:map(select(.Action=="pass" and .Test))|length, postgres:map(select(.Action=="pass" and (.Test // ""|contains("PostgreSQL"))))|length}' "$RUNNER_TEMP/tests.jsonl"
      - name: Vet
        run: |
          /usr/local/bin/yd-io
          go vet -x ./... 2>"$RUNNER_TEMP/vet-trace" || { tail -40 "$RUNNER_TEMP/vet-trace"; exit 1; }
          echo "VET_COMPILER_INVOCATIONS=$(grep -cE '/pkg/tool/linux_arm64/compile ' "$RUNNER_TEMP/vet-trace" || true)"
      - name: Build and verify service image
        run: |
          /usr/local/bin/yd-io
          set -euo pipefail
          sed 's@^RUN CGO_ENABLED=0 go build@RUN --mount=type=cache,id=glasseq-go1274-alpine-arm64,target=/root/.cache/go-build CGO_ENABLED=0 go build@' Dockerfile > "$RUNNER_TEMP/Dockerfile.yieldd"
          docker build --progress=plain -f "$RUNNER_TEMP/Dockerfile.yieldd" --build-arg SOURCE_REVISION="$(git rev-parse HEAD)" -t local/glasseq-pilot:job-$GITHUB_RUN_ID .
          cid=$(docker create local/glasseq-pilot:job-$GITHUB_RUN_ID)
          docker cp "$cid:/usr/local/bin/glasseqserver" "$RUNNER_TEMP/glasseqserver"
          docker rm "$cid"
          sha256sum "$RUNNER_TEMP/glasseqserver"
          result=0
          docker run --rm --network none local/glasseq-pilot:job-$GITHUB_RUN_ID __yieldd_invalid__ >"$RUNNER_TEMP/diagnostic" 2>&1 || result=$?
          test "$result" = 1
          tail -1 "$RUNNER_TEMP/diagnostic" | jq -e '.msg=="invalid command"'
          tail -1 "$RUNNER_TEMP/diagnostic" | jq -e '.error | endswith("(cache probe)")'
