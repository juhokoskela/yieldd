name: Single-use ARM64 compute pilot
on:
  push:
    branches: [bench/phoenix-arm-a11c27e1-8]
permissions:
  contents: read
jobs:
  glasseq:
    name: GlassEQServer / ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: Altra slot 0, runner: yd-pnap-a11c27e1-8-0}
          - {host: Altra slot 1, runner: yd-pnap-a11c27e1-8-1}
          - {host: Altra slot 2, runner: yd-pnap-a11c27e1-8-2}
          - {host: Altra slot 3, runner: yd-pnap-a11c27e1-8-3}
          - {host: Altra slot 4, runner: yd-pnap-a11c27e1-8-4}
          - {host: Altra slot 5, runner: yd-pnap-a11c27e1-8-5}
          - {host: Altra slot 6, runner: yd-pnap-a11c27e1-8-6}
          - {host: Altra slot 7, runner: yd-pnap-a11c27e1-8-7}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    env:
      GOPROXY: "off"
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GLASSEQ_TEST_DATABASE_URL: postgres://glasseq:glasseq@127.0.0.1:5432/glasseq?sslmode=disable
    steps:
      - name: Record host
        run: |
          set -eu
          test "$(uname -m)" = aarch64
          echo "Runner $RUNNER_NAME"; nproc; grep MemTotal /proc/meminfo
          lscpu | grep -E 'Model name|Architecture|CPU.s.:'
          docker version --format '{{.Server.Version}}'
          echo "GOCACHE=/opt/yieldd-warm/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=/opt/yieldd-warm/go-modules" >> "$GITHUB_ENV"
          git init -q "$GITHUB_WORKSPACE"
          echo /opt/yieldd-warm/source.git/objects > "$GITHUB_WORKSPACE/.git/objects/info/alternates"
          if test -f /opt/yieldd-warm/source.git/shallow; then cp /opt/yieldd-warm/source.git/shallow "$GITHUB_WORKSPACE/.git/shallow"; fi
          git -C "$GITHUB_WORKSPACE" remote add origin https://github.com/juhokoskela/GlassEQServer
          git -C "$GITHUB_WORKSPACE" reset --hard 87cd5a17938c2b9b6036a4d37b0b583406989261
      - name: Check out pinned GlassEQServer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: juhokoskela/GlassEQServer
          ref: 87cd5a17938c2b9b6036a4d37b0b583406989261
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          cache: false
      - name: Start PostgreSQL and apply migrations
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/.git/objects/info/alternates"
          for action in "$RUNNER_WORKSPACE/../_actions/actions/"*/*; do test -L "$action"; done
          test -s /opt/hostedtoolcache/go/1.27.4/arm64/VERSION
          echo "WARM_INPUTS verified"
          test -z "$(docker ps -aq)"
          test -z "$(docker volume ls -q)"
          docker run -d --name pilot-postgres -p 127.0.0.1:5432:5432 -e POSTGRES_DB=glasseq -e POSTGRES_USER=glasseq -e POSTGRES_PASSWORD=glasseq postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for i in $(seq 60); do docker exec pilot-postgres pg_isready -h 127.0.0.1 -U glasseq && break; sleep 1; done
          chmod -R a+rX migrations
          docker run --rm --network host -v "$PWD/migrations:/migrations:ro" -e GOOSE_DRIVER=postgres -e GOOSE_DBSTRING="$GLASSEQ_TEST_DATABASE_URL" juhokoskela/goose:v3.27.3@sha256:db4be381f2173bfd8994b9ca03e2fa2f8d7692ac3cef4aa5e2059db3e760cc3d up
      - name: Test with race detection
        run: |
          set -eu
          go test -x -json -race -p 1 -count=1 ./... > "$RUNNER_TEMP/tests.jsonl" 2>"$RUNNER_TEMP/race-trace" || { tail -40 "$RUNNER_TEMP/race-trace"; tail -40 "$RUNNER_TEMP/tests.jsonl"; exit 1; }
          echo "RACE_COMPILER_INVOCATIONS=$(grep -cE '/pkg/tool/linux_arm64/compile ' "$RUNNER_TEMP/race-trace" || true)"
          echo "RACE_TEST_STARTS=$(jq -s '[.[] | select(.Action=="run" and .Test)] | length' "$RUNNER_TEMP/tests.jsonl")"
          jq -s '{passed:map(select(.Action=="pass" and .Test))|length, postgres:map(select(.Action=="pass" and (.Test // ""|contains("PostgreSQL"))))|length}' "$RUNNER_TEMP/tests.jsonl"
      - name: Vet
        run: |
          go vet -x ./... 2>"$RUNNER_TEMP/vet-trace" || { tail -40 "$RUNNER_TEMP/vet-trace"; exit 1; }
          echo "VET_COMPILER_INVOCATIONS=$(grep -cE '/pkg/tool/linux_arm64/compile ' "$RUNNER_TEMP/vet-trace" || true)"
      - name: Build and verify service image
        run: |
          set -euo pipefail
          sed 's@^RUN CGO_ENABLED=0 go build@RUN --mount=type=cache,id=glasseq-go1274-alpine-arm64,target=/root/.cache/go-build CGO_ENABLED=0 go build@' Dockerfile > "$RUNNER_TEMP/Dockerfile.yieldd"
          docker build --progress=plain -f "$RUNNER_TEMP/Dockerfile.yieldd" --build-arg SOURCE_REVISION="$(git rev-parse HEAD)" -t local/glasseq-pilot .
          cid=$(docker create local/glasseq-pilot)
          docker cp "$cid:/usr/local/bin/glasseqserver" "$RUNNER_TEMP/glasseqserver"
          docker rm "$cid"
          sha256sum "$RUNNER_TEMP/glasseqserver"
          result=0
          docker run --rm --network none local/glasseq-pilot __yieldd_invalid__ >"$RUNNER_TEMP/diagnostic" 2>&1 || result=$?
          test "$result" = 1
          tail -1 "$RUNNER_TEMP/diagnostic" | jq -e '.msg=="invalid command"'
